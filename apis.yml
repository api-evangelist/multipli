aid: multipli
name: Multipli
description: 'Multipli is a decentralized yield-infrastructure protocol that lets users and institutions
  generate returns on tokenized real-world assets — gold, stocks, commodities and stablecoins — without
  selling their holdings. Its native rwaUSD token consolidates 100+ Treasury-backed stablecoins and 10+
  tokenized gold assets into a single, standardized collateral primitive that can move freely across DeFi,
  earning yield through delta-neutral arbitrage (contango and funding-rate) strategies. Integration is
  smart-contract-based across multiple EVM chains via a suite of on-chain view functions (Ledger,
  RiskRegistry, PriceRouter); there is no public REST API, SDK or OpenAPI. Multipli is backed by Pantera
  Capital.'
